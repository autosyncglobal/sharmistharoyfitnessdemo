    <!-- Instant scroll reset script to guarantee app starts from the 1st section (top) on mobile restart/reload -->
    <script>
      (function() {
        function resetScrollToTop() {
          try {
            if ('scrollRestoration' in history) {
              history.scrollRestoration = 'manual';
            }
            if (window.location.hash) {
              history.replaceState(null, '', window.location.pathname + window.location.search);
            }
            window.scrollTo(0, 0);
            if (document.documentElement) document.documentElement.scrollTop = 0;
            if (document.body) document.body.scrollTop = 0;
            if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
          } catch (e) {}
        }
        resetScrollToTop();
        window.addEventListener('beforeunload', resetScrollToTop);
        window.addEventListener('pagehide', resetScrollToTop);
        window.addEventListener('pageshow', resetScrollToTop);
        window.addEventListener('load', resetScrollToTop);
      })();
    </script>
